# This provisions a PAID background worker and a persistent disk.
# After first launch, send /id privately to the bot, then add OWNER_USER_ID
# in Render's Environment settings and redeploy.
services:
  - type: worker
    name: telegram-lead-team-bot
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m compileall -q bot.py app.py storage.py backup.py
    startCommand: python -u bot.py
    disk:
      name: lead-team-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/leads.sqlite3
      - key: PYTHONUNBUFFERED
        value: "1"
